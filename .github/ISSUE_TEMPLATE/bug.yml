name: Bug report
description: Something in the applet, tools, provisioner, ops service or site behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Commands, taps or steps. Paste logs or APDU traces in a code block.
  - type: input
    id: versions
    attributes:
      label: Versions and hardware
      description: Commit or release, card chip (for example J3R180), phone or reader.
