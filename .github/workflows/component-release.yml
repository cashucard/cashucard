name: Component release
on:
  push:
    tags: ["firmware-v*", "cardkit-v*", "ops-v*", "provisioner-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing component tag on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: component-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.release.outputs.component }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: release
        env:
          RELEASE_RESOLVE_TAG: "true"
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node tools/release/component.cjs
  verify:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      full: true
      ref: ${{ needs.identity.outputs.commit }}
  package:
    needs: [identity, verify]
    if: needs.identity.outputs.component != 'provisioner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-cardkit
      - name: Package verified component
        env:
          RELEASE_COMPONENT: ${{ needs.identity.outputs.component }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          mkdir -p release
          case "$RELEASE_COMPONENT" in
            firmware)
              cp applet/target/cashu-javacard-*.cap release/
              ;;
            cardkit)
              (cd tools/cardkit && npm pack --ignore-scripts --pack-destination ../../release)
              ;;
            ops)
              (cd ops && yarn install --frozen-lockfile --force)
              for target in staging production; do
                (cd ops && node node_modules/wrangler/bin/wrangler.js deploy --config "wrangler.$target.toml" --dry-run --outdir "../release/$target")
                cp "ops/wrangler.$target.toml" "release/$target/wrangler.toml"
                python3 tools/release/manifest.py normalize "release/$target"
                node --check "release/$target/worker.js"
                (cd ops && node node_modules/wrangler/bin/wrangler.js deploy "../release/$target/worker.js" --config "../release/$target/wrangler.toml" --no-bundle --dry-run --outdir "$RUNNER_TEMP/verify-$target")
              done
              ;;
          esac
          python3 tools/release/manifest.py write release
      - uses: actions/upload-artifact@v5
        with:
          name: component-release
          path: release/
          if-no-files-found: error
  provisioner:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [identity, verify]
    if: needs.identity.outputs.component == 'provisioner'
    uses: ./.github/workflows/provisioner-release.yml
    with:
      tag: ${{ needs.identity.outputs.tag }}
      commit: ${{ needs.identity.outputs.commit }}
    secrets: inherit
  ops-image:
    needs: [identity, verify]
    if: needs.identity.outputs.component == 'ops'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: registry
        name: Refuse replacement of an existing image version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/container.cjs
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.registry.outputs.image }}:${{ steps.registry.outputs.version }}
          build-args: |
            VERSION=${{ steps.registry.outputs.version }}
            REVISION=${{ needs.identity.outputs.commit }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=ops-amd64
            type=gha,scope=ops-arm64
      - name: Verify platforms and record the immutable digest
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p container
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --raw > "$RUNNER_TEMP/ops-index.json"
          node tools/release/container.cjs record "$RUNNER_TEMP/ops-index.json" container/ops-container.json
      - uses: actions/upload-artifact@v5
        with:
          name: ops-container
          path: container/ops-container.json
          if-no-files-found: error

  publish:
    needs: [identity, package, ops-image]
    if: always() && needs.package.result == 'success' && (needs.identity.outputs.component != 'ops' || needs.ops-image.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v5
        with:
          name: component-release
          path: release
      - uses: actions/download-artifact@v5
        if: needs.identity.outputs.component == 'ops'
        with:
          name: ops-container
          path: release
      - name: Include container provenance in the ops release manifest
        if: needs.identity.outputs.component == 'ops'
        env:
          RELEASE_COMPONENT: ops
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: python3 tools/release/manifest.py write release
      # Sigstore-signed build provenance for every published file:
      # `gh attestation verify <file> --repo cashucard/cashucard` names the
      # commit and workflow run that made it (docs/PROVENANCE.md).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release/**"
      - name: Publish component artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          tar -czf "$RUNNER_TEMP/$RELEASE_TAG.tar.gz" -C release .
          node tools/release/publish.cjs "$RUNNER_TEMP/$RELEASE_TAG.tar.gz" release
