<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="824" viewBox="0 0 1000 824" role="img" aria-labelledby="title desc">
<title id="title">Cashu Card ecosystem</title>
<desc id="desc">Wallets and tills use the mint and tap one physical card running the applet. The ops-service authorizes CCP to install or reset that card. Encrypted exports go through a backup job to independent storage and alerts. The backup decryption key has separate custody.</desc>
<style>
svg{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.node{fill:url(#surface);stroke:#365747;stroke-width:1.2}
.support .node{fill:#0d2119;stroke:#365044}
.kicker{fill:#96af9f;font-size:12px;letter-spacing:1.5px;font-weight:600}
.title{fill:#edf4e8;font-size:22px;font-weight:650;letter-spacing:-.5px}
.body{fill:#aac2b0;font-size:16px}
.icon{fill:none;stroke:#cceaa2;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lane{fill:#8eaa99;font-size:12px;font-weight:650;letter-spacing:2px}
.edge{fill:none;stroke:#83a99d;stroke-width:1.7;stroke-linejoin:round}
.nfc{stroke:#cceaa2;stroke-width:2}
.recovery{stroke:#b9ab85;stroke-dasharray:5 5}
.edge-label{fill:#a6c0ac;font-size:14px;text-anchor:middle}
.nfc-label{fill:#cceaa2}
.recovery-label{fill:#c5bda5}
.card-title{fill:#163021;font-size:24px;font-weight:700;letter-spacing:-.6px}
.card-body{fill:#254331;font-size:16px}
.card-chip{fill:none;stroke:#32553b;stroke-width:1.5;stroke-linecap:round}
</style>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#173326"/><stop offset="1" stop-color="#10251c"/></linearGradient>
<linearGradient id="card" x2=".8" y2="1"><stop stop-color="#def4b5"/><stop offset="1" stop-color="#a8cd83"/></linearGradient>
<symbol id="icon-mint" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8h5a2 2 0 0 1 0 4H9m0 0h5a2 2 0 0 1 0 4H9m2-10v12"/></symbol><symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M4 6h14v4M4 6V4h13v2M4 6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16V8H4m16 4h-6v5h6"/><circle cx="16.5" cy="14.5" r=".5"/></symbol><symbol id="icon-till" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 6h6m-6 4h6m-6 4h2m2 0h2m-6 3h2m2 0h2"/></symbol><symbol id="icon-ops" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v7c0 4 18 4 18 0V5M3 12v7c0 4 18 4 18 0v-7"/></symbol><symbol id="icon-ccp" viewBox="0 0 24 24"><rect x="3" y="2" width="12" height="20" rx="3"/><path d="M7 5h4m-3 14h2m9-12c3 3 3 7 0 10m-2-8c2 2 2 4 0 6"/></symbol><symbol id="icon-copy" viewBox="0 0 24 24"><path d="M5 8a8 8 0 0 1 13-3l2 2m0-5v5h-5M19 16a8 8 0 0 1-13 3l-2-2m0 5v-5h5"/></symbol><symbol id="icon-storage" viewBox="0 0 24 24"><path d="M2 7V4h8l3 3h9v13H2V7Zm0 3h20"/></symbol><symbol id="icon-alerts" viewBox="0 0 24 24"><path d="M5 15v-5a7 7 0 0 1 14 0v5l2 3H3l2-3m4 6h6"/></symbol><symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="9" r="5"/><path d="m12 13 9 9m-5-5 3-3m0 6 3-3"/></symbol><symbol id="icon-chip" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 4v16m6-16v16M4 9h5m-5 6h5m6-6h5m-5 6h5"/></symbol>
<marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#83a99d" stroke-width="1.5"/></marker><marker id="lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#cceaa2" stroke-width="1.5"/></marker><marker id="sand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#b9ab85" stroke-width="1.5"/></marker>
</defs>
<rect width="1000" height="824" rx="16" fill="#0a1d15"/>
<text x="32" y="29" class="lane" >PAYMENTS</text><text x="968" y="29" class="lane" text-anchor="end">NUT-CCP / DRAFT</text><path d="M32 370H968M32 594H968" stroke="#294435"/><text x="32" y="399" class="lane" >ISSUANCE</text><text x="32" y="623" class="lane" >RECOVERY</text><path d="M390 100H147V198" class="edge " marker-end="url(#soft)" marker-start="url(#soft)"/><rect x="222.15" y="69" width="83.7" height="21" rx="8" fill="#0a1d15"/><text x="264" y="83" class="edge-label -label" >Cashu API</text><path d="M853 198V100H610" class="edge " marker-end="url(#soft)"/><rect x="685.55" y="69" width="112.9" height="21" rx="8" fill="#0a1d15"/><text x="742" y="83" class="edge-label -label" >Settle online</text><path d="M262 260H385" class="edge nfc" marker-end="url(#lime)"/><rect x="277.5" y="230" width="91" height="21" rx="8" fill="#0a1d15"/><text x="323" y="244" class="edge-label nfc-label" >Own + load</text><path d="M615 260H738" class="edge nfc" marker-end="url(#lime)"/><rect x="630.5" y="230" width="91" height="21" rx="8" fill="#0a1d15"/><text x="676" y="244" class="edge-label nfc-label" >Tap to pay</text><path d="M262 494H385" class="edge " marker-end="url(#soft)" marker-start="url(#soft)"/><rect x="262.9" y="463" width="120.2" height="21" rx="8" fill="#0a1d15"/><text x="323" y="477" class="edge-label -label" >Keys + records</text><path d="M500 432V338" class="edge nfc" marker-end="url(#lime)"/><rect x="508.25" y="376" width="127.5" height="21" rx="8" fill="#0a1d15"/><text x="572" y="390" class="edge-label nfc-label" >Install / reset</text><path d="M147 556V644" class="edge recovery" marker-end="url(#sand)"/><rect x="161.6" y="569" width="134.8" height="21" rx="8" fill="#0a1d15"/><text x="229" y="583" class="edge-label recovery-label" >Encrypted export</text><path d="M262 697H385" class="edge recovery" marker-end="url(#sand)"/><rect x="266.55" y="666" width="112.9" height="21" rx="8" fill="#0a1d15"/><text x="323" y="680" class="edge-label recovery-label" >Copy + verify</text><path d="M147 750V796H853V750" class="edge recovery" marker-end="url(#sand)"/><rect x="392.45" y="782" width="215.1" height="21" rx="8" fill="#0a1d15"/><text x="500" y="796" class="edge-label recovery-label" >Failure / stale-copy alerts</text><g class="component" transform="translate(390 52)"><rect class="node" width="220" height="96" rx="12"/><use href="#icon-mint" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >MINT OPERATOR</text><text x="16" y="63" class="title" >Cashu mint</text><text x="16" y="88" class="body" >Issues + settles ecash</text></g><g class="component" transform="translate(32 198)"><rect class="node" width="230" height="126" rx="12"/><use href="#icon-wallet" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >HOLDER</text><text x="16" y="63" class="title" >Wallet</text><text x="16" y="88" class="body" >Owner key + funding</text></g><g transform="translate(385 192)">
<rect width="230" height="146" rx="15" fill="url(#card)" stroke="#ddf4b7"/>
<use href="#icon-chip" class="card-chip" x="17" y="16" width="30" height="30"/>
<path d="M190 21q9 8 0 16m5-21q14 13 0 26" class="card-chip"/>
<text x="17" y="80" class="card-title" >Cashu card</text>
<text x="17" y="106" class="card-body" >Applet on chip</text>
<text x="17" y="129" class="card-body" >Spending key + ecash</text>
</g><g class="component" transform="translate(738 198)"><rect class="node" width="230" height="126" rx="12"/><use href="#icon-till" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >MERCHANT</text><text x="16" y="63" class="title" >Till app</text><text x="16" y="88" class="body" >Accepts + queues taps</text></g><g class="component" transform="translate(32 432)"><rect class="node" width="230" height="124" rx="12"/><use href="#icon-ops" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >CARD ISSUER</text><text x="16" y="63" class="title" >Ops-service</text><text x="16" y="88" class="body" >Manager keys + records</text><text x="16" y="109" class="body" >SQLite · files / R2</text></g><g class="component" transform="translate(385 432)"><rect class="node" width="230" height="124" rx="12"/><use href="#icon-ccp" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >OPERATOR</text><text x="16" y="63" class="title" >CCP app</text><text x="16" y="88" class="body" >NFC installation + reset</text></g><g class="support" transform="translate(738 432)"><rect class="node" width="230" height="124" rx="12"/><use href="#icon-key" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >SEPARATE CUSTODY</text><text x="16" y="63" class="title" >Backup key</text><text x="16" y="88" class="body" >Vault + offline copy</text></g><g class="support" transform="translate(32 644)"><rect class="node" width="230" height="106" rx="12"/><use href="#icon-copy" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >HOST-SPECIFIC</text><text x="16" y="63" class="title" >Backup / copy job</text><text x="16" y="88" class="body" >Scheduler or Atoll*</text></g><g class="support" transform="translate(385 644)"><rect class="node" width="230" height="106" rx="12"/><use href="#icon-storage" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >INDEPENDENT STORAGE</text><text x="16" y="63" class="title" >Backup files</text><text x="16" y="88" class="body" >e.g. Nextcloud</text></g><g class="support" transform="translate(738 644)"><rect class="node" width="230" height="106" rx="12"/><use href="#icon-alerts" class="icon" x="16" y="14" width="22" height="22"/><text x="46" y="29" class="kicker" >ALERT DELIVERY</text><text x="16" y="63" class="title" >Notifications</text><text x="16" y="88" class="body" >e.g. ntfy</text></g>
</svg>
