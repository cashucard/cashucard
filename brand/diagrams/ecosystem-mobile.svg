<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1168" viewBox="0 0 360 1168" role="img" aria-labelledby="title desc">
<title id="title">Cashu Card ecosystem</title>
<desc id="desc">Wallets and tills use the mint and tap one physical card running the applet. The ops-service authorizes CCP to install or reset that card. Encrypted exports go through a backup job to independent storage and alerts. The backup decryption key has separate custody.</desc>
<style>
svg{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.node{fill:url(#surface);stroke:#365747;stroke-width:1.2}
.support .node{fill:#0d2119;stroke:#365044}
.kicker{fill:#96af9f;font-size:12px;letter-spacing:1.5px;font-weight:600}
.title{fill:#edf4e8;font-size:22px;font-weight:650;letter-spacing:-.5px}
.body{fill:#aac2b0;font-size:16px}
.icon{fill:none;stroke:#cceaa2;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lane{fill:#8eaa99;font-size:12px;font-weight:650;letter-spacing:2px}
.edge{fill:none;stroke:#83a99d;stroke-width:1.7;stroke-linejoin:round}
.nfc{stroke:#cceaa2;stroke-width:2}
.recovery{stroke:#b9ab85;stroke-dasharray:5 5}
.edge-label{fill:#a6c0ac;font-size:14px;text-anchor:middle}
.nfc-label{fill:#cceaa2}
.recovery-label{fill:#c5bda5}
.card-title{fill:#163021;font-size:24px;font-weight:700;letter-spacing:-.6px}
.card-body{fill:#254331;font-size:16px}
.card-chip{fill:none;stroke:#32553b;stroke-width:1.5;stroke-linecap:round}
.title{font-size:19px}.body{font-size:16px}.card-title{font-size:22px}.card-body{font-size:16px}</style>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#173326"/><stop offset="1" stop-color="#10251c"/></linearGradient>
<linearGradient id="card" x2=".8" y2="1"><stop stop-color="#def4b5"/><stop offset="1" stop-color="#a8cd83"/></linearGradient>
<symbol id="icon-mint" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8h5a2 2 0 0 1 0 4H9m0 0h5a2 2 0 0 1 0 4H9m2-10v12"/></symbol><symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M4 6h14v4M4 6V4h13v2M4 6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16V8H4m16 4h-6v5h6"/><circle cx="16.5" cy="14.5" r=".5"/></symbol><symbol id="icon-till" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 6h6m-6 4h6m-6 4h2m2 0h2m-6 3h2m2 0h2"/></symbol><symbol id="icon-ops" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v7c0 4 18 4 18 0V5M3 12v7c0 4 18 4 18 0v-7"/></symbol><symbol id="icon-ccp" viewBox="0 0 24 24"><rect x="3" y="2" width="12" height="20" rx="3"/><path d="M7 5h4m-3 14h2m9-12c3 3 3 7 0 10m-2-8c2 2 2 4 0 6"/></symbol><symbol id="icon-copy" viewBox="0 0 24 24"><path d="M5 8a8 8 0 0 1 13-3l2 2m0-5v5h-5M19 16a8 8 0 0 1-13 3l-2-2m0 5v-5h5"/></symbol><symbol id="icon-storage" viewBox="0 0 24 24"><path d="M2 7V4h8l3 3h9v13H2V7Zm0 3h20"/></symbol><symbol id="icon-alerts" viewBox="0 0 24 24"><path d="M5 15v-5a7 7 0 0 1 14 0v5l2 3H3l2-3m4 6h6"/></symbol><symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="9" r="5"/><path d="m12 13 9 9m-5-5 3-3m0 6 3-3"/></symbol><symbol id="icon-chip" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 4v16m6-16v16M4 9h5m-5 6h5m6-6h5m-5 6h5"/></symbol>
<marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#83a99d" stroke-width="1.5"/></marker><marker id="lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#cceaa2" stroke-width="1.5"/></marker><marker id="sand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#b9ab85" stroke-width="1.5"/></marker>
</defs>
<rect width="360" height="1168" rx="16" fill="#0a1d15"/>
<text x="16" y="28" class="lane" >PAYMENTS</text><text x="344" y="28" class="lane" text-anchor="end">NUT-CCP / DRAFT</text><path d="M16 538H344M16 784H344" stroke="#294435"/><text x="16" y="563" class="lane" >ISSUANCE</text><text x="180" y="810" class="lane" text-anchor="middle">RECOVERY</text><path d="M128 148V174H90V203" class="edge " marker-end="url(#soft)" marker-start="url(#soft)"/><rect x="37.15" y="162" width="83.7" height="21" rx="8" fill="#0a1d15"/><text x="79" y="176" class="edge-label -label" >Cashu API</text><path d="M270 203V174H232V148" class="edge " marker-end="url(#soft)"/><rect x="223.55" y="162" width="112.9" height="21" rx="8" fill="#0a1d15"/><text x="280" y="176" class="edge-label -label" >Settle online</text><path d="M90 323V444H102" class="edge nfc" marker-end="url(#lime)"/><rect x="16.5" y="336" width="91" height="21" rx="8" fill="#0a1d15"/><text x="62" y="350" class="edge-label nfc-label" >Own + load</text><path d="M258 444H270V323" class="edge nfc" marker-end="url(#lime)"/><rect x="253.5" y="336" width="91" height="21" rx="8" fill="#0a1d15"/><text x="299" y="350" class="edge-label nfc-label" >Tap to pay</text><path d="M164 678H196" class="edge " marker-end="url(#soft)" marker-start="url(#soft)"/><rect x="119.9" y="589" width="120.2" height="21" rx="8" fill="#0a1d15"/><text x="180" y="603" class="edge-label -label" >Keys + records</text><path d="M270 620V555H180V524" class="edge nfc" marker-end="url(#lime)"/><rect x="211.25" y="571" width="127.5" height="21" rx="8" fill="#0a1d15"/><text x="275" y="585" class="edge-label nfc-label" >Install / reset</text><path d="M90 732V860" class="edge recovery" marker-end="url(#sand)"/><rect x="106.6" y="746" width="134.8" height="21" rx="8" fill="#0a1d15"/><text x="174" y="760" class="edge-label recovery-label" >Encrypted export</text><path d="M164 914H196" class="edge recovery" marker-end="url(#sand)"/><rect x="123.55" y="829" width="112.9" height="21" rx="8" fill="#0a1d15"/><text x="180" y="843" class="edge-label recovery-label" >Copy + verify</text><path d="M90 968V1062H196" class="edge recovery" marker-end="url(#sand)"/><rect x="64.1" y="990" width="61.8" height="21" rx="8" fill="#0a1d15"/><text x="95" y="1004" class="edge-label recovery-label" >Alerts</text><g class="component" transform="translate(102 56)"><rect class="node" width="156" height="92" rx="12"/><use href="#icon-mint" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >Cashu mint</text><text x="16" y="81" class="body" >Issue + settle</text></g><g class="component" transform="translate(16 203)"><rect class="node" width="148" height="120" rx="12"/><use href="#icon-wallet" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >Wallet</text><text x="16" y="81" class="body" >Owner key</text><text x="16" y="102" class="body" >Load ecash</text></g><g class="component" transform="translate(196 203)"><rect class="node" width="148" height="120" rx="12"/><use href="#icon-till" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >Till app</text><text x="16" y="81" class="body" >Accept taps</text><text x="16" y="102" class="body" >Settle online</text></g><g transform="translate(102 378)">
<rect width="156" height="146" rx="15" fill="url(#card)" stroke="#ddf4b7"/>
<use href="#icon-chip" class="card-chip" x="17" y="16" width="30" height="30"/>
<path d="M116 21q9 8 0 16m5-21q14 13 0 26" class="card-chip"/>
<text x="17" y="76" class="card-title" >Cashu card</text>
<text x="17" y="101" class="card-body" >Applet on chip</text>
<text x="17" y="124" class="card-body" >Spending key</text>
</g><g class="component" transform="translate(16 620)"><rect class="node" width="148" height="112" rx="12"/><use href="#icon-ops" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >Ops-service</text><text x="16" y="81" class="body" >Manager keys</text><text x="16" y="102" class="body" >Card records</text></g><g class="component" transform="translate(196 620)"><rect class="node" width="148" height="112" rx="12"/><use href="#icon-ccp" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >CCP app</text><text x="16" y="81" class="body" >Install + reset</text></g><g class="support" transform="translate(16 860)"><rect class="node" width="148" height="108" rx="12"/><use href="#icon-copy" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >Backup job</text><text x="16" y="81" class="body" >Scheduler /</text><text x="16" y="102" class="body" >Atoll*</text></g><g class="support" transform="translate(196 860)"><rect class="node" width="148" height="108" rx="12"/><use href="#icon-storage" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >Backup files</text><text x="16" y="81" class="body" >e.g. Nextcloud</text></g><g class="support" transform="translate(196 1020)"><rect class="node" width="148" height="86" rx="12"/><use href="#icon-alerts" class="icon" x="16" y="14" width="22" height="22"/><text x="16" y="56" class="title" >Notifications</text><text x="16" y="81" class="body" >e.g. ntfy</text></g><path d="M16 1122H344" stroke="#294435"/><use href="#icon-key" class="icon" x="16" y="1136" width="20" height="20"/><text x="45" y="1151" class="body" >Backup key: vault + offline copy</text>
</svg>
